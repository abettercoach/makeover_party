<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="app.js"></script>
    <link href="style.css" rel="stylesheet">
    </link>
    <title>Makeup Party</title>

    <!-- p5 Canvas Link -->
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

    <!-- google fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Emilys+Candy&display=swap" rel="stylesheet">
</head>

<body>
    <h1>Makeover Party</h1>
    <h3 id="room-status">you are the <span id="roomT">HOST</span></h3>
    <div class="flex-container">
        <!-- COL1 : clear canvas and sliders column -->
        <div class="canvas" id="left-buttons">
            <button id="clearCanvas">clear</button>

            <!-- sliders -->
            <div class="slidecontainer">
                <p>size</p>
                <input type="range" min="1" max="100" value="50" class="slider" id="sizeSlider">
            </div>
            <div class="slidecontainer">
                <p>opacity</p>
                <input type="range" min="1" max="100" value="100" class="slider" id="opacitySlider">
            </div>
        </div>
        <!-- COL 2: p5 Canvas -->
        <div class="canvas" id="p5Canvas">
            <!-- p5 Canvas goes in here -->
        </div>
        <!-- COL 3: Color Palette / Brushes -->
        <!-- colour palette / brushes column -->
        <div class="canvas" id="right-buttons">
            <div id="colorPalette">
                <button class="color-btn" style="background-color: #00ff00;" data-color="#00ff00"></button>
                <button class="color-btn" style="background-color: #0000ff;" data-color="#0000ff"></button>
                <button class="color-btn" style="background-color: #ffff00;" data-color="#ffff00"></button>
                <button class="color-btn" style="background-color: #ff00ff;" data-color="#ff00ff"></button>
                <button class="color-btn" style="background-color: #00ffff;" data-color="#00ffff"></button>
                <button class="color-btn" style="background-color: #ffa500;" data-color="#ffa500"></button>
                <button class="color-btn" style="background-color:grey">+</button>
            </div>

            <div id="brushes">
                <button id="softB"><img src="icons/icons8-makeup-brush-48.png" alt="soft brush"></button>
                <button id="hardB"><img src="icons/icons8-pencil-48.png" alt="hard brush"></button>
                <button id="eraseB"><img src="icons/icons8-erase-48.png" alt="erase"></button>

                <!-- icon credits -->
                <!-- <a target="_blank" href="https://icons8.com/icon/18161/makeup-brush">Makeup Brush</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a> -->
                <!-- <a target="_blank" href="https://icons8.com/icon/12082/edit-pencil">Pencil</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a> -->
                <!-- <a target="_blank" href="https://icons8.com/icon/18705/erase">Erase</a> icon by <a target="_blank" href="https://icons8.com">Icons8</a> -->
            </div>
        </div>
    </div>

    <!-- Script links  -->
    <script type="text/javascript" src="/socket.io/socket.io.js"></script>
    <script src="sketch.js"></script>
</body>

</html>
